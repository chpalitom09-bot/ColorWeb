<g transform="translate(30 42)"><rect width="76" height="62" rx="10" fill="#2d3035" stroke="#3a3d44"/><circle cx="12" cy="11" r="3" fill="#3a3d44"/><circle cx="22" cy="11" r="3" fill="#3a3d44"/><circle cx="32" cy="11" r="3" fill="#3a3d44"/>
<rect x="10" y="24" width="30" height="28" rx="6" fill="#ff9156"/><rect x="46" y="24" width="20" height="12" rx="4" fill="#3fb8af"/><rect x="46" y="40" width="20" height="12" rx="4" fill="#6c5ce7"/>
<g transform="translate(25 38)"><circle r="9" fill="none" stroke="#fff" stroke-width="2"/><circle r="9" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="9;20;20" keyTimes="0;.6;1"/><animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values=".8;0;0" keyTimes="0;.6;1"/></circle>
<animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" values="25 38;56 30;56 46;25 38" calcMode="spline" keyTimes="0;.33;.66;1" keySplines="0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1"/></g></g>
<text x="136" y="52" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#eceef0">Partout dans Chrome</text>
<text x="136" y="84" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">Sites, images, vidéos, PDF ouverts</text>
<text x="136" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">dans le navigateur. Si c'est à</text>
<text x="136" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">l'écran, vous pouvez le pointer.</text></g>
<g transform="translate(460 0)"><rect width="440" height="170" rx="18" fill="#232529" stroke="#3a3d44"/>
<g transform="translate(30 42)"><rect width="76" height="76" y="-6" rx="16" fill="#2d3035" stroke="#3a3d44"/><text x="38" y="46" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="46" font-weight="800" fill="#eceef0">A</text>
<rect x="29" y="30" width="10" height="10" fill="none" stroke="#7aa2ff" stroke-width="2"><animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;.15;1"/></rect></g>
<text x="136" y="52" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#eceef0">Précise sur le texte</text>
<text x="136" y="84" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">Le mode texte (touche T) ignore</text>
<text x="136" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">le lissage des lettres et récupère</text>
<text x="136" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">leur vraie couleur.</text></g>
<g transform="translate(0 190)"><rect width="440" height="170" rx="18" fill="#232529" stroke="#3a3d44"/>
<g transform="translate(30 42)"><rect x="0" y="12" width="76" height="62" rx="14" fill="#14151a"/>
<g><rect x="0" y="0" width="76" height="62" rx="14" fill="#2d3035" stroke="#4a4e57" stroke-width="1.5"/><text x="38" y="42" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="30" font-weight="800" fill="#eceef0">C</text>
<animateTransform attributeName="transform" type="translate" dur="2.2s" repeatCount="indefinite" values="0 0;0 0;0 9;0 9;0 0;0 0" keyTimes="0;.45;.5;.62;.67;1"/></g></g>
<text x="136" y="52" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#eceef0">Raccourci clavier</text>
<text x="136" y="84" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">Alt + Maj + C lance la pipette</text>
<text x="136" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">sans ouvrir le menu, depuis</text>
<text x="136" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">n'importe quelle page.</text></g>
<g transform="translate(460 190)"><rect width="440" height="170" rx="18" fill="#232529" stroke="#3a3d44"/>
<g transform="translate(30 42)"><rect x="0" y="-4" width="76" height="20" rx="8" fill="#2d3035" stroke="#3a3d44"/><rect x="0" y="-4" width="76" height="20" rx="8" fill="#7aa2ff" opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="4.5s" repeatCount="indefinite" keyTimes="0;.3333;.6667" values="1;0;0"/></rect><text x="38" y="10" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="800" fill="#eceef0" letter-spacing="1">HEX</text><rect x="0" y="20" width="76" height="20" rx="8" fill="#2d3035" stroke="#3a3d44"/><rect x="0" y="20" width="76" height="20" rx="8" fill="#7aa2ff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="4.5s" repeatCount="indefinite" keyTimes="0;.3333;.6667" values="0;1;0"/></rect><text x="38" y="34" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="800" fill="#eceef0" letter-spacing="1">RGB</text><rect x="0" y="44" width="76" height="20" rx="8" fill="#2d3035" stroke="#3a3d44"/><rect x="0" y="44" width="76" height="20" rx="8" fill="#7aa2ff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="4.5s" repeatCount="indefinite" keyTimes="0;.3333;.6667" values="0;0;1"/></rect><text x="38" y="58" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="800" fill="#eceef0" letter-spacing="1">HSL</text></g>
<text x="136" y="52" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#eceef0">HEX, RGB ou HSL</text>
<text x="136" y="84" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">Copiez le format dont vous avez</text>
<text x="136" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">besoin : HEX pour le CSS, RGB ou</text>
<text x="136" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" fill="#9a9fa8">HSL pour le reste.</text></g>
</svg>